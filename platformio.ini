; Schrader 3142M TPMS scanner
; ESP32 DevKitC V1 + CC1101 433MHz + SSD1306 0.96" OLED
;
; Envs:
;   schraderscanner  - normale build, dit is wat je wilt flashen
;   diag_raw         - dumpt pulse/gap timings van elk signaal
;   diag_schrader    - laat decoder 196 zelf loggen waar hij faalt
;   diag_fsk         - FSK-pad, om te zien of er signaal is (decodeert NIET)
;   tune             - CC1101 AGC/bandbreedte sweep, duurt uren
;
; Zie TROUBLESHOOTING.md voor wanneer je welke env gebruikt.

[platformio]
default_envs = schraderscanner

[env]
platform = espressif32@6.1.0
framework = arduino
board = esp32dev

; 460800 en niet de 921600 uit de rtl_433_ESP voorbeelden.
;
; Dit board heeft een CP2102 en hangt achter een keten USB-hubs. Op 921600
; faalt de upload wisselend met "Unable to verify flash chip connection",
; soms vlak na "Changing baud rate to 921600". De bijbehorende melding
; "Detected crystal freq 15.67MHz is quite different to normalized freq 26MHz"
; is geen hardwareprobleem maar een symptoom van diezelfde onbetrouwbare link.
;
; Werkt dit nog niet betrouwbaar, zet beide dan op 115200. Pas dan ook
; SERIAL_BAUD in include/config.h aan: monitor_speed en Serial.begin() moeten
; gelijk zijn, anders krijg je alleen onleesbare tekens.
monitor_speed = 460800
upload_speed = 460800

monitor_filters = esp32_exception_decoder, time

; rtl_433_ESP heeft chain+ nodig, anders vindt de LDF de RadioLib-headers
; niet die diep in de library-sources geincludeerd worden.
lib_ldf_mode = chain+

lib_deps =
  https://github.com/NorthernMan54/rtl_433_ESP.git
  https://github.com/1technophile/Arduino-Log.git#d13cd80aa02c8cf79a33ca24c554ed3331c3679f
  bblanchon/ArduinoJson@^7.0.4
  olikraus/U8g2@^2.35.19

; 223 OOK-decoders + ArduinoJson + U8g2 passen niet in de standaard
; 1.3MB app-partitie. huge_app geeft 3MB app en laat SPIFFS vallen,
; wat we niet gebruiken.
board_build.partitions = huge_app.csv

; ---------------------------------------------------------------------------
; Gedeelde hardware-definitie
; ---------------------------------------------------------------------------
; GDO0 op 13 en niet op de 22 uit de rtl_433_ESP README: 22 is I2C SCL
; voor het OLED. GDO0 is de datapin die de ESP32 met interrupts uitleest.
[hardware]
build_flags =
  '-DRF_CC1101="CC1101"'
  '-DRF_MODULE_CS=5'
  '-DRF_MODULE_GDO0=13'
  '-DRF_MODULE_GDO2=4'
  '-DRF_MODULE_FREQUENCY=433.92'
  '-DONBOARD_LED=2'
  ; Doorgegeven zodat de sketch kan controleren dat SERIAL_BAUD in config.h
  ; en monitor_speed hierboven niet uit elkaar lopen.
  '-DMONITOR_SPEED=${env.monitor_speed}'

; ---------------------------------------------------------------------------
; Capture-drempels
; ---------------------------------------------------------------------------
; MINIMUM_SIGNAL_LENGTH is de belangrijkste regel in dit bestand.
;
; rtl_433_ESP default is 40000us voor OOK. isCompleteSignal() eist
; duration > MINIMUM_SIGNAL_LENGTH, dus signalen korter dan 40ms worden
; weggegooid VOORDAT een decoder ze ziet.
;
; Een Schrader-frame is 56 bits Manchester bij ~122us/symbool = ~14ms.
; Met de default komt er dus nooit iets door tenzij de sensor meerdere
; frames in een lange burst zet. 8000us laat een enkel frame door en
; houdt losse ruispieken buiten.
;
; MINIMUM_PULSE_LENGTH (default 50us) blijft staan: symboolduur is 122us.
[thresholds]
build_flags =
  '-DMINIMUM_SIGNAL_LENGTH=8000'

; ---------------------------------------------------------------------------
; Normale build
; ---------------------------------------------------------------------------
[env:schraderscanner]
build_flags =
  ${hardware.build_flags}
  ${thresholds.build_flags}
  ; TRACE en niet NOTICE. De CC1101-registerdump van RF_MODULE_INIT_STATUS
  ; logt op de library's LOG_INFO (prioriteit 6), en LOG_LEVEL_NOTICE laat
  ; maar t/m prioriteit 5 door. Juist CC1101_VERSION (0x14 = SPI werkt,
  ; 0x00/0xff = bedrading mis) wil je bij het aansluiten kunnen zien.
  ;
  ; ArduinoLog kent geen INFO-niveau; TRACE is het eerstvolgende dat de dump
  ; doorlaat. Dat zet ook de per-signaal regels aan, wat tijdens het inregelen
  ; juist nuttig is. Wil je het stiller, zet dit op LOG_LEVEL_NOTICE; je raakt
  ; dan de registerdump kwijt maar de decodes blijven.
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
  '-DRF_MODULE_INIT_STATUS=true'

; ---------------------------------------------------------------------------
; Demo: schermlayout bekijken zonder zendende sensor
; ---------------------------------------------------------------------------
; Voert elke 4 seconden een nepmeting in en doorloopt alle schermen: 1 sensor,
; breedste waarden, oude meting, 2 sensoren, wachtscherm. Handig om de
; leesbaarheid te beoordelen zonder op de sensor te wachten.
;
; De radio draait gewoon mee, dus een echte decode overschrijft de demo bij de
; volgende stap. Flash hierna de normale env terug.
[env:demo]
extends = env:schraderscanner
build_flags =
  ${env:schraderscanner.build_flags}
  '-DDEMO_MODE=1'

; ---------------------------------------------------------------------------
; Diagnose 1: zie ik uberhaupt pulsen?
; ---------------------------------------------------------------------------
; Dumpt pulse/gap-timings van elk opgevangen signaal, ook de niet-decodeerbare.
; Hiermee check je of je 122us-pulsparen ziet. Zie je die, dan werkt de radio
; en zit het probleem in het slicen of de decoder.
;
; Let op: dit is luidruchtig. Gebruik 'pio device monitor > logs/raw.log'.
[env:diag_raw]
build_flags =
  ${hardware.build_flags}
  ${thresholds.build_flags}
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
  '-DRF_MODULE_INIT_STATUS=true'
  '-DRAW_SIGNAL_DEBUG=true'
  '-DPUBLISH_UNPARSED=true'
  '-DDEMOD_DEBUG=true'
  '-DSIGNAL_RSSI=true'

; ---------------------------------------------------------------------------
; Diagnose 2: waarom faalt de Schrader-decoder?
; ---------------------------------------------------------------------------
; RTL_VERBOSE=196 zet verbose aan voor precies decoder 196. De decoder logt
; dan zelf welke stap faalt:
;   "Row error"            -> bitbuffer heeft meerdere rows
;   "Preamble not found"   -> 0x7ff8 niet gevonden, timing zit naast
;   "Too short"            -> preamble gevonden maar <56 bits erna
;   "CRC error"            -> bits komen door, maar net verkeerd
;   "MSG <hex>"            -> de ruwe 56 bits, handmatig na te rekenen
;
; Dit is de nuttigste env als de radio werkt maar je geen decodes krijgt.
[env:diag_schrader]
build_flags =
  ${hardware.build_flags}
  ${thresholds.build_flags}
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
  '-DRF_MODULE_INIT_STATUS=true'
  '-DRTL_VERBOSE=196'
  '-DDEMOD_DEBUG=true'
  '-DPUBLISH_UNPARSED=true'

; ---------------------------------------------------------------------------
; Diagnose 3: is het eigenlijk FSK?
; ---------------------------------------------------------------------------
; De FCC-documentatie van de Schrader RDC3 (FCC ID MRXRDC3) stelt dat de
; sensor in Rotating Mode FSK met 50% Manchester gebruikt, terwijl de
; rtl_433-decoder in het OOK-pad geregistreerd staat. Op een RTL-SDR maakt
; dat niet uit (die demoduleert de envelope), op een CC1101 in ASK/OOK-mode
; mogelijk wel.
;
; BELANGRIJK: decoder 196 staat NIET in het FSK-pad geregistreerd. Deze env
; decodeert dus niets. Hij dient om te zien of er in FSK-mode een signaal
; binnenkomt waar OOK niets zag. Zie je hier wel pulsen en in diag_raw niet,
; dan is dat het antwoord en moeten we de decoder naar het FSK-pad verhuizen.
[env:diag_fsk]
build_flags =
  ${hardware.build_flags}
  '-DOOK_MODULATION=false'
  '-DMINIMUM_SIGNAL_LENGTH=500'
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
  '-DRF_MODULE_INIT_STATUS=true'
  '-DRAW_SIGNAL_DEBUG=true'
  '-DPUBLISH_UNPARSED=true'
  '-DDEMOD_DEBUG=true'

; ---------------------------------------------------------------------------
; Diagnose 4: CC1101 AGC/bandbreedte sweep
; ---------------------------------------------------------------------------
; Laatste redmiddel. Loopt automatisch door frequentie-, bandbreedte- en
; AGC-instellingen en rapporteert per instelling hoeveel decodes er waren.
; Duurt uren en vereist dat de sensor ondertussen blijft zenden, dus
; praktisch alleen zinvol met een 125kHz wektool of tijdens een lange rit.
;
; Gebruik dit pas als diag_raw en diag_schrader niets opleveren.
[env:tune]
build_flags =
  ${hardware.build_flags}
  ${thresholds.build_flags}
  '-DLOG_LEVEL=LOG_LEVEL_NOTICE'
  '-DCC1101_OOK_TUNING'
  '-DCC1101_TUNING_WINDOW_SECONDS=120'
  '-DCC1101_TUNING_SIGNAL_INTERVAL_SECONDS=30'
  '-DCC1101_TUNING_BASE_BANDWIDTH=406.0'
  '-DCC1101_TUNING_BASE_AGCCTRL2=0x03'
  '-DCC1101_TUNING_BASE_AGCCTRL0=0x91'
